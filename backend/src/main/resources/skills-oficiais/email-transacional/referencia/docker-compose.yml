# origem: skills-modelo/estagios/email-transacional/docker-compose.yml
# Desenvolvimento local: só a infraestrutura (a API e a web rodam com `pnpm dev`).
# Instalação no cliente é outra coisa: deploy/docker-compose.yml (skill instalacao-docker-compose).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    # 127.0.0.1: só esta máquina alcança o banco de dev (sem isso o Docker publica em todas as interfaces).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de entrada falsa: recebe qualquer e-mail enviado pela API em dev (nada sai para a internet).
  # SMTP em 127.0.0.1:1025 e interface web em http://localhost:8025. Sem volume: as mensagens somem ao recriar.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_dev:
