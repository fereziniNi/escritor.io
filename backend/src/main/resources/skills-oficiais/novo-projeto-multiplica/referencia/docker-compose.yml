# origem: skills-modelo/estagios/novo-projeto-multiplica/docker-compose.yml
# Desenvolvimento local: só a infraestrutura (a API e a web rodam com `pnpm dev`).
# Instalação no cliente é outra coisa: deploy/docker-compose.yml (skill instalacao-docker-compose).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    # 127.0.0.1: só esta máquina alcança o banco de dev (sem isso o Docker publica em todas as interfaces).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev:
