spring:
  application:
    name: presenca-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/presenca
    username: presenca
    password: presenca
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
