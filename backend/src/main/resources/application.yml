spring:
  application:
    name: presenca-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/presenca
    username: presenca
    password: presenca
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025

app:
  email:
    remetente: no-reply@escritor.io

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
