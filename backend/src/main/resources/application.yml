spring:
  application:
    name: presenca-backend
  datasource:
    # Papel de runtime, SEM privilégio de dono sobre as tabelas (ver db-init/criar-papel-app.sql).
    # É o papel usado por toda a aplicação em operação normal - por isso o REVOKE UPDATE/DELETE
    # em registro_ponto (V8) realmente impede a aplicação de editar/apagar marcações de ponto.
    url: jdbc:postgresql://localhost:5432/presenca
    username: presenca_app
    password: presenca_app
  flyway:
    # Papel de migração: dono das tabelas, só usado para rodar o Flyway na subida da aplicação.
    # Nunca usado para servir requisições.
    url: jdbc:postgresql://localhost:5432/presenca
    user: presenca
    password: presenca
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025

app:
  email:
    remetente: no-reply@escritor.io
  jwt:
    # Segredo de DEV apenas. Em qualquer ambiente real, sobrescrever via variável
    # de ambiente APP_JWT_SEGREDO com um valor gerado (nunca versionar o de produção).
    segredo: troque-este-segredo-em-producao-defina-a-variavel-app-jwt-segredo
  evolution:
    # Pedido do cliente: avisar o chefe no WhatsApp (via Evolution API) sempre que alguém bate
    # entrada/saída (ver `NotificacaoPontoWhatsApp`). Desligado por padrão (`habilitado: false`) -
    # exige uma instância do Evolution API pareada com um número real via QR code antes de fazer
    # sentido ligar (ver DEVELOPMENT.md "Integração com WhatsApp"). Em produção, sobrescrever via
    # variáveis de ambiente APP_EVOLUTION_*.
    base-url: http://localhost:8085
    api-key: troque-esta-chave-defina-a-variavel-app-evolution-api-key
    instancia: escritorio
    chefe-numero: ""
    habilitado: false
  google:
    # Pedido do usuário: "algo muito parecido com o agenda do google. Poderia fazer isso?? Ou ate
    # mesmo integrar?" - cada funcionário conecta a própria conta Google (OAuth2) e a escala dele
    # é publicada como eventos no Google Agenda dele mesmo (ver `GoogleCalendarSincronizacaoService`).
    # Requer um projeto no Google Cloud Console com a Calendar API habilitada e um OAuth client ID
    # tipo "Web application" - ver DEVELOPMENT.md "Integração com Google Agenda". Sem
    # client-id/client-secret configurados (env `APP_GOOGLE_CLIENT_ID`/`APP_GOOGLE_CLIENT_SECRET`),
    # a integração fica indisponível (endpoints retornam indicando desabilitado), sem quebrar o
    # resto do sistema.
    client-id: ""
    client-secret: ""
    redirect-uri: http://127.0.0.1:5175/integracoes/google/callback
    # Chave AES-256 (32 bytes em base64) pra criptografar o refresh token em repouso - diferente
    # de `TokenRenovacao.tokenHash` (SHA-256, só comparação), aqui o valor precisa voltar em texto
    # claro pra ser reenviado pra Google. Gerar com `openssl rand -base64 32` em produção - NUNCA
    # versionar o valor real, sobrescrever via APP_GOOGLE_CHAVE_CRIPTOGRAFIA.
    chave-criptografia: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    # O app ainda não guarda fuso horário por usuário (mesma limitação de sempre, ver ADR 0010
    # citado em JornadaService) - os eventos vão pra Google com um fuso fixo.
    fuso-horario: America/Sao_Paulo

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
