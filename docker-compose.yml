services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: presenca
      POSTGRES_USER: presenca
      POSTGRES_PASSWORD: presenca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db-init/criar-papel-app.sql:/docker-entrypoint-initdb.d/01-criar-papel-app.sql:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP - o backend envia e-mails de login aqui
      - "8025:8025"   # UI web para ver os e-mails capturados

volumes:
  postgres_data:
