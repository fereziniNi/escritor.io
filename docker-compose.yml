services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: presenca
      POSTGRES_USER: presenca
      POSTGRES_PASSWORD: presenca
    # Auditoria de segurança (VULN-06, MEDIUM): sem o "127.0.0.1:" na frente, o Docker publica a
    # porta em TODAS as interfaces de rede do host (0.0.0.0), não só localhost - alcançável por
    # qualquer outra máquina na mesma rede/Wi-Fi, com a senha padrão "presenca" de dev. O
    # container só precisa ser alcançável pelo `backend` (rede interna do compose, não passa por
    # aqui) - essa publicação de porta existe só pra conveniência de inspecionar o banco de fora
    # com um cliente SQL na própria máquina. `127.0.0.1:` preserva exatamente essa conveniência,
    # só fecha o acesso de fora do host.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db-init/criar-papel-app.sql:/docker-entrypoint-initdb.d/01-criar-papel-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presenca"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    # Auditoria de segurança (VULN-06, MEDIUM): o Mailpit não tem autenticação nenhuma e concentra
    # TODOS os códigos de login de TODOS os usuários - publicado em 0.0.0.0 (sem "127.0.0.1:"),
    # qualquer um na mesma rede consegue ler os e-mails de qualquer conta e logar como ela, sem
    # nunca precisar da senha de ninguém (login é passwordless, o código é a única barreira). Só a
    # própria máquina precisa acessar a UI/SMTP.
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP - o backend envia e-mails de login aqui
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"     # UI web para ver os e-mails capturados

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Só a URL muda (localhost -> nome do serviço na rede do compose); usuário/senha continuam
      # os mesmos de application.yml (presenca_app/presenca_app pro runtime, presenca/presenca só
      # pro Flyway - ver ADR 0009).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/presenca
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/presenca
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      # Auditoria de segurança (VULN-01, CRITICAL): sem isto, o backend caía de volta pro
      # placeholder público de application.yml e dava pra forjar um JWT de ADMIN sem autenticar -
      # confirmado ao vivo nesta auditoria. Diferente das integrações opcionais abaixo (que têm
      # `:-` com um valor padrão porque vêm desligadas por padrão), JWT é sempre ativo - por isso
      # `:?` (obrigatório): o `docker compose up` recusa subir sem JWT_SEGREDO no .env, em vez de
      # silenciosamente cair num valor fraco. Gere o seu com `openssl rand -base64 64` e coloque
      # em JWT_SEGREDO no .env da raiz (ver DEVELOPMENT.md) - nunca versione o valor real.
      APP_JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env - ver DEVELOPMENT.md (openssl rand -base64 64)}
      # Integração com WhatsApp (pedido do cliente: avisar o chefe quando alguém bate ponto) -
      # desligada por padrão (`APP_EVOLUTION_HABILITADO=false`), mesmo com o serviço `evolution-api`
      # do perfil `whatsapp` no ar. Ver DEVELOPMENT.md "Integração com WhatsApp".
      APP_EVOLUTION_BASE_URL: http://evolution-api:8080
      APP_EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
      APP_EVOLUTION_INSTANCIA: ${EVOLUTION_INSTANCIA:-escritorio}
      APP_EVOLUTION_CHEFE_NUMERO: ${EVOLUTION_CHEFE_NUMERO:-}
      APP_EVOLUTION_HABILITADO: ${EVOLUTION_HABILITADO:-false}
      # Integração com Google Agenda (pedido do usuário: "algo muito parecido com o agenda do
      # google... ou ate mesmo integrar") - cada funcionário conecta a própria conta. Sem
      # GOOGLE_OAUTH_CLIENT_ID/SECRET no .env, fica indisponível sem quebrar o resto do sistema.
      # Ver DEVELOPMENT.md "Integração com Google Agenda".
      APP_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      APP_GOOGLE_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      APP_GOOGLE_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:5175/integracoes/google/callback}
      APP_GOOGLE_CHAVE_CRIPTOGRAFIA: ${GOOGLE_TOKEN_CHAVE_CRIPTO:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # `nginx.conf.template` (deploy no Railway) precisa saber onde está o backend - aqui é
      # sempre o nome do serviço no compose, mesmo valor que já estava hardcoded no nginx.conf
      # antes dele virar template.
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      # Faz o proxy_pass do Nginx resolver "backend" de novo a cada requisição (via o resolvedor
      # embutido do Docker) em vez de fixar o IP uma única vez no boot - sem isso, recriar o
      # container do backend (rebuild, restart) deixa o Nginx preso no IP antigo até reiniciar
      # também. Ver o comentário completo em nginx.conf.template.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # Só pra ambiente de teste local: cria o primeiro usuário (ADMIN) depois que o backend migra o
  # schema - sem isso, POST /usuarios (que cria os demais) exige um ADMIN que ainda não existe.
  # Idempotente (docker/seed-usuario-admin.sql usa ON CONFLICT/NOT EXISTS), então reiniciar o
  # compose sem apagar o volume não duplica nada.
  seed:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PGPASSWORD: presenca
    volumes:
      - ./docker/seed-usuario-admin.sql:/seed.sql:ro
    entrypoint: >
      sh -c "
      until psql -h postgres -U presenca -d presenca -c 'select 1 from usuario limit 1' >/dev/null 2>&1; do
        echo 'aguardando o backend migrar o schema...';
        sleep 2;
      done;
      psql -h postgres -U presenca -d presenca -f /seed.sql
      "

  # Integração com WhatsApp (pedido do cliente: "integração com o evolution api para... enviar
  # uma mensagem para o chefe avisando"). Fica atrás do perfil `whatsapp` de propósito - são mais
  # 3 containers (Evolution API + o Postgres/Redis dele) que a maioria do trabalho do dia a dia
  # não precisa; `docker compose up -d` (sem perfil) continua exatamente como antes. Subir com
  # `docker compose --profile whatsapp up -d`. Ver DEVELOPMENT.md "Integração com WhatsApp" pro
  # passo a passo completo (criar instância, parear via QR code, ligar o envio).
  #
  # Sem serviço de UI (`evolution-manager`) de propósito - testado nesta sessão e a imagem
  # `evoapicloud/evolution-manager:latest` trava num bug de nginx conhecido e não corrigido
  # (`invalid value "must-revalidate"`, EvolutionAPI/evolution-api#2093) - o pareamento via REST
  # puro (ver DEVELOPMENT.md) funciona perfeitamente e não depende dela.
  evolution-postgres:
    image: postgres:16
    profiles: ["whatsapp"]
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    profiles: ["whatsapp"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    profiles: ["whatsapp"]
    # Pedido do usuário: "o relatório diário pelo celular... eu tentei testar e não enviou" -
    # causa raiz encontrada nesta verificação: o container tinha caído sozinho há 2 dias
    # ("JavaScript heap out of memory", loop de reconexão do Baileys) e ninguém percebeu porque o
    # envio é best-effort/assíncrono (sem erro visível na UI, por design - ver `EnvioWhatsAppEvolution`).
    # `unless-stopped` faz o Docker religar o container sozinho se ele cair de novo, em vez de
    # ficar fora do ar silenciosamente até alguém notar.
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      # MESMA chave usada por `APP_EVOLUTION_API_KEY` acima (o backend chama isto aqui) - troque
      # as duas juntas.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
    # Auditoria de segurança (VULN-06, MEDIUM): publicado em 0.0.0.0 (sem "127.0.0.1:"), qualquer
    # um na mesma rede alcança a API de controle do WhatsApp - com a API key padrão (se
    # EVOLUTION_API_KEY não foi trocada no .env), dá pra enviar mensagens como o número pareado.
    # Só a própria máquina precisa (curl manual de pareamento via REST, ver DEVELOPMENT.md) - o
    # backend fala com ela pela rede interna do compose, não por esta porta publicada.
    ports:
      - "127.0.0.1:${EVOLUTION_API_PORT:-8085}:8080"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
