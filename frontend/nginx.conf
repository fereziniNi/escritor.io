# Espelha a allowlist de proxy do vite.config.ts (server.proxy) - os mesmos prefixos, pro mesmo
# efeito: tudo que não é um desses vai pro index.html (rotas da SPA). Se um prefixo novo de API
# for adicionado num, precisa ser adicionado no outro também.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(health|auth|usuarios|equipes|projetos|ponto|ajustes|quadros) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
