# Espelha a allowlist de proxy do vite.config.ts (server.proxy) - os mesmos prefixos, pro mesmo
# efeito: tudo que não é um desses vai pro index.html (rotas da SPA). Se um prefixo novo de API
# for adicionado num, precisa ser adicionado no outro também.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(health|auth|usuarios|equipes|projetos|ponto|ajustes|quadros|colunas|cards|apontamentos|mapas) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ws é upgrade de conexão (S3.11), não request HTTP normal como os prefixos acima - precisa
    # dos headers Upgrade/Connection, por isso fica num location à parte em vez de entrar na
    # mesma allowlist regex de cima.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
